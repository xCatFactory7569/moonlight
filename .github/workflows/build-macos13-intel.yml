name: Build Moonlight for macOS 13 (Intel)

# Run it by hand: Actions tab -> "Build Moonlight for macOS 13 (Intel)" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode 26
        # Moonlight's metadata package needs Swift tools 6.2, i.e. Xcode 26+.
        run: |
          echo "Xcode versions on this runner:"
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 on this runner. Change 'runs-on' to macos-26-intel and run again."
            exit 1
          fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lower the macOS requirement from 14.0 to 13.0
        run: |
          sed -i '' 's/"14\.0"/"13.0"/g' project.yml
          echo "--- macOS version lines in project.yml now:"
          grep -n '13\.0\|14\.0' project.yml

      - name: Add macOS 13 compatibility helpers
        run: |
          cat > Sources/App/MacOS13Compat.swift <<'SWIFT'
          // MacOS13Compat.swift
          //
          // Lets Moonlight run on macOS 13 Ventura. Two SwiftUI features Moonlight uses were
          // added in macOS 14: the two-value `onChange` and `ContentUnavailableView`. This file
          // provides equivalents built only from macOS 13 features.

          import AppKit
          import SwiftUI

          // MARK: - onChange

          private struct OnChangeCompatModifier<V: Equatable>: ViewModifier {
              let value: V
              let initial: Bool
              let action: (V, V) -> Void
              @State private var previous: V

              init(value: V, initial: Bool, action: @escaping (V, V) -> Void) {
                  self.value = value
                  self.initial = initial
                  self.action = action
                  _previous = State(initialValue: value)
              }

              func body(content: Content) -> some View {
                  content
                      .onChange(of: value) { newValue in
                          let oldValue = previous
                          previous = newValue
                          action(oldValue, newValue)
                      }
                      .onAppear {
                          if initial { action(value, value) }
                      }
              }
          }

          extension View {
              func onChangeCompat<V: Equatable>(
                  of value: V, initial: Bool = false,
                  _ action: @escaping (_ oldValue: V, _ newValue: V) -> Void
              ) -> some View {
                  modifier(OnChangeCompatModifier(value: value, initial: initial, action: action))
              }

              func onChangeCompat<V: Equatable>(
                  of value: V, initial: Bool = false,
                  _ action: @escaping (_ newValue: V) -> Void
              ) -> some View {
                  modifier(OnChangeCompatModifier(value: value, initial: initial) { _, new in action(new) })
              }

              func onChangeCompat<V: Equatable>(
                  of value: V, initial: Bool = false,
                  _ action: @escaping () -> Void
              ) -> some View {
                  modifier(OnChangeCompatModifier(value: value, initial: initial) { _, _ in action() })
              }
          }

          // MARK: - openSettings

          // The `openSettings` environment action is macOS 14+. On macOS 13 the Settings
          // window is opened by sending the standard menu action.
          struct OpenSettingsCompat {
              func callAsFunction() {
                  NSApp.activate(ignoringOtherApps: true)
                  NSApp.sendAction(Selector(("showSettingsWindow:")), to: nil, from: nil)
              }
          }

          private struct OpenSettingsCompatKey: EnvironmentKey {
              static let defaultValue = OpenSettingsCompat()
          }

          extension EnvironmentValues {
              var openSettingsCompat: OpenSettingsCompat {
                  get { self[OpenSettingsCompatKey.self] }
                  set { self[OpenSettingsCompatKey.self] = newValue }
              }
          }

          // MARK: - ContentUnavailableView

          // Declared in the app's own module, so it is used instead of the macOS 14 system version.
          struct ContentUnavailableView<Label: View, Description: View, Actions: View>: View {
              private let label: Label
              private let descriptionView: Description
              private let actions: Actions

              init(
                  @ViewBuilder label: () -> Label,
                  @ViewBuilder description: () -> Description,
                  @ViewBuilder actions: () -> Actions
              ) {
                  self.label = label()
                  self.descriptionView = description()
                  self.actions = actions()
              }

              var body: some View {
                  VStack(spacing: 10) {
                      label.labelStyle(CompatUnavailableLabelStyle())
                      descriptionView
                          .font(.callout)
                          .foregroundStyle(.secondary)
                          .multilineTextAlignment(.center)
                      actions
                  }
                  .padding(24)
                  .frame(maxWidth: .infinity, maxHeight: .infinity)
              }
          }

          extension ContentUnavailableView where Description == EmptyView, Actions == EmptyView {
              init(@ViewBuilder label: () -> Label) {
                  self.init(label: label, description: { EmptyView() }, actions: { EmptyView() })
              }
          }

          extension ContentUnavailableView where Actions == EmptyView {
              init(@ViewBuilder label: () -> Label, @ViewBuilder description: () -> Description) {
                  self.init(label: label, description: description, actions: { EmptyView() })
              }
          }

          extension ContentUnavailableView
          where Label == SwiftUI.Label<Text, Image>, Description == EmptyView, Actions == EmptyView {
              init(_ title: LocalizedStringKey, systemImage name: String) {
                  self.init(
                      label: { SwiftUI.Label(title, systemImage: name) },
                      description: { EmptyView() },
                      actions: { EmptyView() }
                  )
              }
          }

          extension ContentUnavailableView
          where Label == SwiftUI.Label<Text, Image>, Description == Text, Actions == EmptyView {
              init(_ title: LocalizedStringKey, systemImage name: String, description: Text) {
                  self.init(
                      label: { SwiftUI.Label(title, systemImage: name) },
                      description: { description },
                      actions: { EmptyView() }
                  )
              }
          }

          private struct CompatUnavailableLabelStyle: LabelStyle {
              func makeBody(configuration: Configuration) -> some View {
                  VStack(spacing: 8) {
                      configuration.icon
                          .font(.system(size: 42))
                          .foregroundStyle(.secondary)
                      configuration.title
                          .font(.title2.weight(.semibold))
                  }
              }
          }
          SWIFT
          head -5 Sources/App/MacOS13Compat.swift

      - name: Use the compatible onChange in the Mac app code
        run: |
          grep -rl '\.onChange(of:' Sources --include=*.swift \
            | grep -v '^Sources/Mobile/' \
            | grep -v 'MacOS13Compat.swift' \
            | xargs sed -i '' 's/\.onChange(of:/.onChangeCompat(of:/g'
          echo "Files changed:"; git status --short

      - name: Patch other macOS 14 / 13.3 APIs
        run: |
          # openSettings (macOS 14) -> compat helper
          sed -i '' 's/(\\\.openSettings)/(\\.openSettingsCompat)/' \
            Sources/App/MoonlightCommands.swift Sources/UI/Transport/TransportBarView.swift
          # volumeTypeName (macOS 13.3) -> only use it when available, else fall back to statfs
          sed -i '' 's/if let type = (try? url.resourceValues(forKeys: \[.volumeTypeNameKey\]))?.volumeTypeName {/if #available(macOS 13.3, iOS 16.4, *), let type = (try? url.resourceValues(forKeys: [.volumeTypeNameKey]))?.volumeTypeName {/' \
            Sources/Scanner/PortableIdentity.swift
          grep -n "openSettings" Sources/App/MoonlightCommands.swift Sources/UI/Transport/TransportBarView.swift
          grep -n "volumeTypeName" Sources/Scanner/PortableIdentity.swift
          # Same macOS 13.3 issue in FolderBookmarkStore: fall back to the existing statfs check
          perl -pi -e 's/^        \(try\? url\.resourceValues\(forKeys: \[\.volumeTypeNameKey\]\)\)\?\.volumeTypeName\?\.lowercased\(\)$/        if #available(macOS 13.3, iOS 16.4, *) { return (try? url.resourceValues(forKeys: [.volumeTypeNameKey]))?.volumeTypeName?.lowercased() }\n        return PortableIdentityFilesystemPolicy.filesystemType(for: url)/' \
            Sources/Scanner/FolderBookmarkStore.swift
          grep -n -B1 -A3 "volumeTypeName" Sources/Scanner/FolderBookmarkStore.swift
          # Traffic lights cut off on macOS 13: the title bar clips the moved buttons
          python3 - <<'PY'
          p = 'Sources/UI/Transport/MiniPlayerView.swift'
          s = open(p).read()
          marker = "        for button in buttons {\n            let offsetFromClose"
          assert s.count(marker) == 1, "marker not found"
          block = """if #unavailable(macOS 14) {
                      // macOS 13 clips the title bar to its default height, which cuts off the moved buttons.
                      let frameView = window.contentView?.superview
                      var ancestor: NSView? = superview
                      while let view = ancestor, view !== frameView {
                          view.wantsLayer = true
                          view.layer?.masksToBounds = false
                          ancestor = view.superview
                      }
                  }
          
          """
          open(p, 'w').write(s.replace(marker, block + marker))
          PY
          # ArtworkView: give the compiler the type it fails to infer on the macOS 13 target
          sed -i '' 's/let loadedImage = await Task.detached(priority: .userInitiated) {/let loadedImage: NSImage? = await Task.detached(priority: .userInitiated) {/' \
            Sources/UI/Views/ArtworkView.swift
          grep -n "let loadedImage" Sources/UI/Views/ArtworkView.swift

      - name: Replace iCloud sync with an "off" version (needs macOS 14 and a paid Apple account)
        run: |
          cat > Sources/Database/CloudKitSyncCoordinator.swift <<'SWIFT'
          // CloudKitSyncCoordinator.swift
          //
          // macOS 13 build: iCloud sync needs CKSyncEngine (macOS 14+) and a signed build with iCloud
          // enabled, so on this build sync is simply switched off. Everything else is unchanged.

          import Combine
          import Foundation

          enum CloudSyncProblem: String, Sendable {
              case notSignedIn = "Not signed into iCloud"
              case accountChanged = "iCloud account changed"
              case quotaExceeded = "iCloud storage quota exceeded"
              case zoneDeleted = "Moonlight's iCloud zone was deleted"
              case networkUnavailable = "Network unavailable"
              case throttled = "iCloud is temporarily throttling sync"
              case schemaTooNew = "Some data requires a newer Moonlight version"
              case changeTokenExpired = "A complete iCloud refresh is required"
              case fetchedBatchRejected = "Downloaded changes require sync recovery"
              case unknown = "Unable to sync"
          }

          final class CloudSyncStatus: ObservableObject {
              @Published var isEnabled = false
              @Published var isSyncing = false
              @Published var pendingChangeCount = 0
              @Published var lastSuccessfulSync: Date?
              @Published var problem: CloudSyncProblem?
              @Published var details: String?
              @Published var requiresFullResync = false
              @Published var lastProtected: Date?
              @Published var protectionProblem: String?
              /// A status must describe the actual sync state, not merely the absence of
              /// an error. In particular, a disabled sync service is never "up to date."
              var headline: String {
                  guard isEnabled else { return "iCloud Sync is Off" }
                  if let problem { return problem.rawValue }
                  if isSyncing { return lastSuccessfulSync == nil ? "Connecting to iCloud…" : "Syncing…" }
                  if pendingChangeCount > 0 { return "Changes ready to sync" }
                  return lastSuccessfulSync == nil ? "Ready to sync" : "Up to date"
              }

              var explanation: String {
                  guard isEnabled else {
                      return "Moonlight keeps everything on this Mac until you choose to turn on iCloud Sync."
                  }
                  if let details { return details }
                  if isSyncing { return "Checking your private iCloud metadata." }
                  if pendingChangeCount > 0 { return "\(pendingChangeCount) local change\(pendingChangeCount == 1 ? "" : "s") will upload when iCloud is available." }
                  if lastSuccessfulSync != nil { return "Your synchronized metadata matches the latest iCloud copy." }
                  return "Ready to make the first private iCloud copy of your metadata."
              }
          }

          /// A deliberately narrow signal for changes that have been committed to the
          /// synchronized library state. This is separate from `CloudSyncStatus`: status
          /// updates describe transport activity, while this signal means read models may
          /// now be stale.
          final class SynchronizedLibraryChangeNotifier: ObservableObject {
              @Published private(set) var generation = 0

              func noteCommittedChange() {
                  generation &+= 1
              }
          }

          final class CloudKitSyncCoordinator: NSObject, @unchecked Sendable {
              static let containerIdentifier = "iCloud.com.musopen.moonlight"
              static let zoneName = "MoonlightMetadata"
              static let schemaVersion = 1

              let status = CloudSyncStatus()
              let synchronizedLibraryChanges = SynchronizedLibraryChangeNotifier()
              private let manager: DatabaseManager

              init(manager: DatabaseManager) {
                  self.manager = manager
                  super.init()
              }

              func start() async {}

              func setEnabled(_ enabled: Bool) async {
                  await MainActor.run {
                      status.isEnabled = false
                      status.details = enabled ? "iCloud Sync is not available in this macOS 13 build." : nil
                  }
              }

              func synchronize(force: Bool = true) async {}
              func handleRemoteNotification(_ userInfo: [AnyHashable: Any]) async -> Bool { false }
              func flushForLifecycleTransition() async {}
              func recoverKeepingLocalState() async {}
              func recoverUsingCloudState() async {}
              func performFullRefetch() async {}
              func noteSynchronizedStateReplacement() async {}
          }
          SWIFT
          head -8 Sources/Database/CloudKitSyncCoordinator.swift

      - name: Use custom app icon (only if Config/moonlight-icon-1024.png exists)
        run: |
          SRC=Config/moonlight-icon-1024.png
          if [ -f "$SRC" ]; then
            SET=Sources/Assets.xcassets/AppIcon.appiconset
            for n in 16 32 64 128 256 512 1024; do
              sips -z $n $n "$SRC" --out "$SET/icon_${n}x${n}.png" > /dev/null
            done
            echo "Custom icon applied."
          else
            echo "No custom icon found; using the default icon."
          fi

      - name: Add the right-side Inspector panel (only if the panel file is present)
        run: |
          if [ ! -f Sources/UI/Inspector/InspectorPanel.swift ]; then
            echo "Inspector panel file not found; building without the right-side panel."
            exit 0
          fi
          python3 - <<'PY'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, "%s: anchor found %d times: %r" % (path, s.count(old), old[:70])
              open(path, 'w').write(s.replace(old, new))

          # Main window: show the panel to the right of the content
          cv = 'Sources/App/ContentView.swift'
          patch(cv,
              "    @State private var isFolderDropTargeted = false\n",
              "    @State private var isFolderDropTargeted = false\n"
              "    @AppStorage(\"inspectorVisible\") private var inspectorVisible = false\n")
          patch(cv,
              "            .ignoresSafeArea(.all, edges: .top)\n"
              "            .frame(maxWidth: .infinity, maxHeight: .infinity)\n"
              "        }\n"
              "        .overlay {",
              "            .ignoresSafeArea(.all, edges: .top)\n"
              "            .frame(maxWidth: .infinity, maxHeight: .infinity)\n"
              "\n"
              "            if inspectorVisible && appState.selectedSidebarItem != .nowPlaying {\n"
              "                InspectorPanel(controller: appState.playbackController)\n"
              "                    .frame(width: 320)\n"
              "                    .transition(.move(edge: .trailing))\n"
              "            }\n"
              "        }\n"
              "        .overlay {")
          patch(cv,
              "        .animation(.easeInOut(duration: 0.18), value: appState.isSidebarCollapsed)\n",
              "        .animation(.easeInOut(duration: 0.18), value: appState.isSidebarCollapsed)\n"
              "        .animation(.easeInOut(duration: 0.18), value: inspectorVisible)\n")

          # Transport bar: a button to show or hide the panel
          tb = 'Sources/UI/Transport/TransportBarView.swift'
          patch(tb,
              "    @State private var isQueuePresented = false\n",
              "    @State private var isQueuePresented = false\n"
              "    @AppStorage(\"inspectorVisible\") private var inspectorVisible = false\n")
          patch(tb,
              "                    Spacer().frame(width: 2)\n"
              "                    VolumeSliderView()\n",
              "                    TransportIconButton(icon: \"sidebar.right\", isActive: inspectorVisible, action: {\n"
              "                        inspectorVisible.toggle()\n"
              "                    })\n"
              "                    .help(\"Show Inspector\")\n"
              "                    Spacer().frame(width: 2)\n"
              "                    VolumeSliderView()\n")
          patch(tb, "                .frame(width: 330, alignment: .trailing)\n",
                    "                .frame(width: 364, alignment: .trailing)\n")
          patch(tb, "                    .frame(width: 330)\n",
                    "                    .frame(width: 364)\n")
          print("Inspector panel hooked in.")
          PY

      - name: Work around a songs-table crash on macOS 13
        run: |
          python3 - <<'PY'
          import glob, re
          # Passing a Set's "contains" function around crashed in the macOS 13 build.
          # Use plain closures instead.
          pattern = re.compile(r'\.(map|filter)\((\w+)\.contains\)')
          total = 0
          for f in glob.glob('Sources/**/*.swift', recursive=True):
              if '/Mobile/' in f:
                  continue
              s = open(f).read()
              new, n = pattern.subn(lambda m: '.%s { %s.contains($0) }' % (m.group(1), m.group(2)), s)
              if n:
                  open(f, 'w').write(new)
                  total += n
                  print("%s: %d" % (f, n))
          assert total >= 5, "expected to patch at least 5 places, patched %d" % total
          PY

      - name: Graphite palette (dark gray with black accents) for the Moonlight theme
        run: |
          python3 - <<'PY'
          import glob

          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, "%s: anchor found %d times: %r" % (path, s.count(old), old[:70])
              open(path, 'w').write(s.replace(old, new))

          # Dark gray and black palette, with neutral (non-blue) highlights
          patch('Sources/UI/DesignSystem.swift',
              '                bgBase: "#1f2329", bgContent: "#282c34", bgSidebar: "#21252b", bgSidebarOpacity: 0.72,\n'
              '                bgElevated: "#303640", bgElevated2: "#3b4250", bgChrome: "#2c313a", transportOpacity: 0.76,\n'
              '                hover: "#61afef", selected: "#61afef", accent: "#61afef", accentStrong: "#528bff",\n'
              '                borderSoft: "#abb2bf", borderMedium: "#abb2bf", borderStrong: "#c8ccd4"\n',
              '                bgBase: "#0e0e0f", bgContent: "#242426", bgSidebar: "#1a1a1c", bgSidebarOpacity: 0.72,\n'
              '                bgElevated: "#303033", bgElevated2: "#3b3b3f", bgChrome: "#111112", transportOpacity: 0.86,\n'
              '                hover: "#a0a0a6", selected: "#a8a8ae", accent: "#c8c8cc", accentStrong: "#e6e6e9",\n'
              '                borderSoft: "#c4c4c9", borderMedium: "#c4c4c9", borderStrong: "#dcdce0"\n')

          # The sidebar sheen had a blue tint on dark themes
          patch('Sources/UI/DesignSystem.swift',
              'Color(hex: isLight ? "#ffffff" : "#cfd7ff")',
              'Color(hex: "#ffffff")')

          # Use the theme accent instead of the macOS system accent (blue by default)
          count = 0
          for f in glob.glob('Sources/**/*.swift', recursive=True):
              if '/Mobile/' in f:
                  continue
              s = open(f).read()
              if 'Color.accentColor' in s:
                  count += s.count('Color.accentColor')
                  open(f, 'w').write(s.replace('Color.accentColor', 'Color.dAccent'))
          patch('Sources/UI/Views/ScanProgressBanner.swift', ': .accentColor))', ': Color.dAccent))')
          print("Replaced %d system accent uses." % count)

          # Tint standard controls (toggles, sliders, buttons) with the theme accent
          patch('Sources/App/ContentView.swift',
              '        .animation(.easeInOut(duration: 0.18), value: appState.isSidebarCollapsed)\n',
              '        .animation(.easeInOut(duration: 0.18), value: appState.isSidebarCollapsed)\n'
              '        .tint(Color.dAccent)\n')
          print("Graphite palette applied.")
          PY

      - name: Remove the Discover / Live Radio section from the sidebar
        run: |
          python3 - <<'PY'
          path = 'Sources/UI/Sidebar/SidebarView.swift'
          s = open(path).read()
          old = "                    librarySection\n                    discoverySection\n                    playlistSection\n"
          new = "                    librarySection\n                    playlistSection\n"
          assert s.count(old) == 1, "sidebar anchor not found"
          open(path, 'w').write(s.replace(old, new))
          print("Discover / Live Radio removed from the sidebar.")
          PY

      - name: Add lyrics to the Now Playing screen (only if the lyrics file is present)
        run: |
          if [ ! -f Sources/UI/Lyrics/LyricsPanel.swift ]; then
            echo "Lyrics panel file not found; building without lyrics."
            exit 0
          fi
          python3 - <<'PY'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, "%s: anchor found %d times: %r" % (path, s.count(old), old[:70])
              open(path, 'w').write(s.replace(old, new))

          np = 'Sources/UI/Overlays/NowPlayingView.swift'

          patch(np,
              "    @State private var isQueueExpanded = false\n",
              "    @State private var isQueueExpanded = false\n"
              "    @AppStorage(\"nowPlayingLyrics\") private var showsLyrics = false\n")

          patch(np,
              "                if let track = currentTrack {\n"
              "                    ScrollView {\n"
              "                        nowPlayingContent(for: track, size: proxy.size)\n"
              "                            .frame(maxWidth: .infinity)\n"
              "                            .frame(minHeight: proxy.size.height)\n"
              "                    }\n"
              "                    .scrollIndicators(.hidden)\n",
              "                if let track = currentTrack {\n"
              "                    HStack(spacing: 0) {\n"
              "                        ScrollView {\n"
              "                            nowPlayingContent(\n"
              "                                for: track,\n"
              "                                size: CGSize(width: showsLyrics ? proxy.size.width * 0.5 : proxy.size.width, height: proxy.size.height)\n"
              "                            )\n"
              "                            .frame(maxWidth: .infinity)\n"
              "                            .frame(minHeight: proxy.size.height)\n"
              "                        }\n"
              "                        .scrollIndicators(.hidden)\n"
              "\n"
              "                        if showsLyrics {\n"
              "                            LyricsPanel(track: track, controller: controller)\n"
              "                                .frame(width: proxy.size.width * 0.5)\n"
              "                        }\n"
              "                    }\n"
              "                    .animation(.easeInOut(duration: 0.25), value: showsLyrics)\n")

          patch(np,
              "            NowPlayingSceneMenu()\n"
              "        }\n"
              "        .padding(.horizontal, 10)\n",
              "            if currentRadioStation == nil {\n"
              "                NowPlayingChromeButton(\n"
              "                    icon: showsLyrics ? \"quote.bubble.fill\" : \"quote.bubble\",\n"
              "                    help: showsLyrics ? \"Hide Lyrics\" : \"Show Lyrics\"\n"
              "                ) {\n"
              "                    showsLyrics.toggle()\n"
              "                }\n"
              "            }\n"
              "\n"
              "            NowPlayingSceneMenu()\n"
              "        }\n"
              "        .padding(.horizontal, 10)\n")
          print("Lyrics hooked into Now Playing.")
          PY

      - name: Last.fm - enter your own keys inside the app (kept in the Keychain, never on GitHub)
        run: |
          mkdir -p Sources/LastFM
          cat > Sources/LastFM/LastFMLocalKeys.swift <<'SWIFT'
          // LastFMLocalKeys.swift
          //
          // Lets you type your own Last.fm API key and shared secret into Settings. They are saved only in
          // this Mac's Keychain, so they never have to be part of the app file or stored on GitHub.

          import SwiftUI
          import Security

          enum LastFMLocalKeys {
              private static let service = "Moonlight Last.fm API keys"
              private static let account = "api-credentials"

              static func load() -> (apiKey: String, secret: String)? {
                  let query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account,
                      kSecReturnData as String: true,
                      kSecMatchLimit as String: kSecMatchLimitOne
                  ]
                  var result: CFTypeRef?
                  guard SecItemCopyMatching(query as CFDictionary, &result) == errSecSuccess,
                        let data = result as? Data,
                        let text = String(data: data, encoding: .utf8)
                  else { return nil }
                  let parts = text.components(separatedBy: "\n")
                  guard parts.count >= 2, !parts[0].isEmpty, !parts[1].isEmpty else { return nil }
                  return (parts[0], parts[1])
              }

              static func save(apiKey: String, secret: String) -> Bool {
                  let base: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: service,
                      kSecAttrAccount as String: account
                  ]
                  SecItemDelete(base as CFDictionary)
                  var item = base
                  item[kSecValueData as String] = Data("\(apiKey)\n\(secret)".utf8)
                  return SecItemAdd(item as CFDictionary, nil) == errSecSuccess
              }
          }

          struct LastFMKeyEntryView: View {
              @State private var apiKey = ""
              @State private var secret = ""
              @State private var didSave = false
              @State private var didFail = false

              var body: some View {
                  VStack(alignment: .leading, spacing: 8) {
                      Text("Add your own Last.fm keys")
                          .font(.system(size: 12, weight: .semibold))
                          .foregroundColor(Color.textPrimary)
                      Text("Create a free key at last.fm/api/account/create. Both values are stored only in this Mac's Keychain.")
                          .font(.system(size: 11))
                          .foregroundColor(Color.textSecondary)
                          .fixedSize(horizontal: false, vertical: true)
                      Link("Open the Last.fm API page", destination: URL(string: "https://www.last.fm/api/account/create")!)
                          .font(.system(size: 11))
                      TextField("API key", text: $apiKey)
                          .textFieldStyle(.roundedBorder)
                      SecureField("Shared secret", text: $secret)
                          .textFieldStyle(.roundedBorder)
                      HStack(spacing: 10) {
                          Button("Save keys") {
                              let key = apiKey.trimmingCharacters(in: .whitespacesAndNewlines)
                              let value = secret.trimmingCharacters(in: .whitespacesAndNewlines)
                              didFail = !LastFMLocalKeys.save(apiKey: key, secret: value)
                              didSave = !didFail
                          }
                          .disabled(apiKey.trimmingCharacters(in: .whitespaces).isEmpty
                                    || secret.trimmingCharacters(in: .whitespaces).isEmpty)
                          if didSave {
                              Text("Saved. Quit and reopen Moonlight to turn on Last.fm.")
                                  .font(.system(size: 11))
                                  .foregroundColor(Color.textSecondary)
                          }
                          if didFail {
                              Text("Could not save to the Keychain.")
                                  .font(.system(size: 11))
                                  .foregroundColor(Color.orange)
                          }
                      }
                  }
                  .padding(.top, 4)
              }
          }
          SWIFT
          python3 - <<'PY'
          def patch(path, old, new):
              s = open(path).read()
              assert s.count(old) == 1, "%s: anchor found %d times: %r" % (path, s.count(old), old[:70])
              open(path, 'w').write(s.replace(old, new))

          # If the app was built without keys, use the ones saved in the Keychain
          patch('Sources/LastFM/LastFMConfiguration.swift',
              "    static func bundled(in bundle: Bundle = .main) -> LastFMConfiguration {\n"
              "        LastFMConfiguration(\n"
              "            apiKey: bundle.object(forInfoDictionaryKey: \"LastFMAPIKey\") as? String ?? \"\",\n"
              "            sharedSecret: bundle.object(forInfoDictionaryKey: \"LastFMSharedSecret\") as? String ?? \"\"\n"
              "        )\n"
              "    }\n",
              "    static func bundled(in bundle: Bundle = .main) -> LastFMConfiguration {\n"
              "        let built = LastFMConfiguration(\n"
              "            apiKey: bundle.object(forInfoDictionaryKey: \"LastFMAPIKey\") as? String ?? \"\",\n"
              "            sharedSecret: bundle.object(forInfoDictionaryKey: \"LastFMSharedSecret\") as? String ?? \"\"\n"
              "        )\n"
              "        if built.isConfigured { return built }\n"
              "        if let saved = LastFMLocalKeys.load() {\n"
              "            return LastFMConfiguration(apiKey: saved.apiKey, sharedSecret: saved.secret)\n"
              "        }\n"
              "        return built\n"
              "    }\n")

          # Show the key form in Last.fm settings while no keys are available
          patch('Sources/UI/Views/LastFMSettingsView.swift',
              "                Link(\"Last.fm privacy policy\"",
              "                if case .unavailable = integration.status {\n"
              "                    LastFMKeyEntryView()\n"
              "                }\n"
              "\n"
              "                Link(\"Last.fm privacy policy\"")
          print("Last.fm key entry added.")
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve dependencies (pinned versions only, with retries)
        # SwiftPM sometimes fails with "already exists in file system" when it downloads the
        # same audio library twice at the same moment. A retry normally succeeds.
        run: |
          for attempt in 1 2 3 4; do
            echo "=== Attempt $attempt ==="
            if xcodebuild -resolvePackageDependencies \
                 -project Moonlight.xcodeproj \
                 -scheme Moonlight \
                 -clonedSourcePackagesDirPath build/SourcePackages \
                 -onlyUsePackageVersionsFromResolvedFile; then
              echo "Dependencies resolved."
              exit 0
            fi
            echo "Failed; cleaning partial downloads and retrying..."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            sleep 10
          done
          echo "::error::Could not resolve dependencies after 4 attempts."
          exit 1

      - name: Build (Intel, Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -destination "platform=macOS,arch=x86_64" \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1

      - name: Show build errors
        if: failure()
        run: |
          echo "===== ALL ERRORS (copy everything below) ====="
          grep -E "error:" build.log 2>/dev/null | sort -u | head -100 || true
          echo "===== END ====="

      - name: Check the app really runs on macOS 13
        run: |
          APP="build/Build/Products/Release/Moonlight.app"
          BIN="$APP/Contents/MacOS/Moonlight"
          lipo -info "$BIN"
          vtool -show-build "$BIN"
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $2; exit}')
          echo "Minimum macOS: $MINOS"
          MAJOR=${MINOS%%.*}
          if [ "$MAJOR" -gt 13 ]; then
            echo "::error::App still requires macOS $MINOS"
            exit 1
          fi

      - name: Sign for local use (no Apple account needed)
        run: |
          cat > local.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key><true/>
              <key>com.apple.security.files.user-selected.read-write</key><true/>
              <key>com.apple.security.network.client</key><true/>
          </dict>
          </plist>
          PLIST
          APP="build/Build/Products/Release/Moonlight.app"
          codesign --force --deep --sign - --timestamp=none \
            --entitlements local.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent build/Build/Products/Release/Moonlight.app dist/Moonlight-macOS13-intel.zip
          ls -lh dist

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-macOS13-intel
          path: dist/Moonlight-macOS13-intel.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
